openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recent-work
    description: Recent work carousel (public)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /recent-work:
    get:
      operationId: getRecentWork
      tags: [recent-work]
      summary: Get active recent work items for carousel
      description: Returns active recent work items ordered by date_added DESC, limit 10
      responses:
        "200":
          description: List of recent work items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentWorkItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RecentWorkItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [photo, video]
        embedUrl:
          type: string
        title:
          type: string
        category:
          type: string
          enum: ["Music", "Sports", "Hospitality & Events"]
        dateAdded:
          type: string
          format: date-time
        active:
          type: boolean
      required:
        - id
        - type
        - embedUrl
        - title
        - category
        - dateAdded
        - active
